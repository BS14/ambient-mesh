apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app
resources:
  - namespace.yaml
  - https://github.com/GoogleCloudPlatform/microservices-demo/kustomize/base?ref=v0.10.7
patches:
  # The base creates a public LoadBalancer for the frontend.
  # We expose it through the Istio ingress gateway instead.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
  # Show "AWS" in the frontend's platform badge instead of "local".
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENV_PLATFORM
                    value: "aws"
